server {
    listen 80;
    server_name _;
    add_header Retry-After 300 always;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    error_page 503 /maintenance.html;

    location = /maintenance.html {
        internal;
        root /usr/share/nginx/html;
    }

    location / {
        return 503;
    }
}
