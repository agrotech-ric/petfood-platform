spring:
  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        show_sql: false

logging:
  level:
    org.springframework.amqp: DEBUG
    com.rabbitmq: DEBUG

app:
  security:
    cookie-secure: false
    cookie-path: /
    rate-limit-pepper: ${RATE_LIMIT_PEPPER:local-development-only}
  mail:
    exchange: mail.x
    rk:
      confirm: mail.confirm
      twofa: mail.twofa
