server {
    listen 80;
    server_name _;
    absolute_redirect off;

    location = /petfood {
        return 308 /petfood/;
    }

    location /petfood/ {
        root /usr/share/nginx/html;
        rewrite ^/petfood/(.*)$ /$1 break;
        try_files $uri $uri/ /index.html;
    }

    location / {
        root   /usr/share/nginx/html;
        index  index.html;
        try_files $uri $uri/ /index.html;
    }
}
